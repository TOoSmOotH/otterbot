services:
  otterbot:
    build:
      target: deps
    shm_size: "256m"
    ports:
      - "62626:62626"
      - "5173:5173"
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @otterbot/shared build && { pnpm --filter @otterbot/shared dev & HOST=0.0.0.0 pnpm --filter @otterbot/server dev & pnpm --filter @otterbot/web dev -- --host 0.0.0.0; }"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${OTTERBOT_DATA_DIR:-./docker/otterbot}:/otterbot
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - HOME=/otterbot/home
      - OTTERBOT_DB_KEY=${OTTERBOT_DB_KEY}
      - OTTERBOT_UID=${OTTERBOT_UID:-1000}
      - OTTERBOT_GID=${OTTERBOT_GID:-1000}
      - CI=true
      - ENABLE_DESKTOP=${ENABLE_DESKTOP:-true}
      - DESKTOP_RESOLUTION=${DESKTOP_RESOLUTION:-1280x720x24}
      - SUDO_MODE=${SUDO_MODE:-restricted}

  searxng:
    profiles: [search]
    ports:
      - "8080:8080"

volumes:
  node_modules:
