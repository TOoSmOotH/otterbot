services:
  otterbot:
    environment:
      - OTTERBOT_COMFYUI_URL=${OTTERBOT_COMFYUI_URL:-http://comfyui:8188}

  comfyui:
    build:
      context: .
      dockerfile: docker/comfyui/Dockerfile
    environment:
      - CLI_ARGS=${COMFYUI_CLI_ARGS:---listen 0.0.0.0 --port 8188}
      - COMFYUI_DATA_ROOT=/data
    volumes:
      - ${OTTERBOT_DATA_DIR:-./docker/otterbot}/comfyui:/data
    expose:
      - "8188"
    restart: unless-stopped
