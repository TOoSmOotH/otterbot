name: CI

on:
  pull_request:
    branches: [main, beta, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/test-and-build

  e2e-mock:
    name: E2E (Mock Mode)
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Cache pnpm store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start mock server
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
        env:
          MOCK_MODE: "true"
          MOCK_PASSPHRASE: test-passphrase-e2e
          MOCK_STREAM_DELAY: "0"

      - name: Run mock E2E tests
        run: npx playwright test -c e2e/playwright.config.ts e2e/tests/25-mock-mode.spec.ts
        env:
          BASE_URL: https://localhost:62627

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop mock server
        if: always()
        run: docker compose -f docker-compose.e2e.yml down
