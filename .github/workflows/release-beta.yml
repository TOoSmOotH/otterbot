name: Release (Beta)

on:
  push:
    branches: [beta]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/test-and-build

  publish:
    name: Publish Beta to npm
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Derive beta version from git
        id: version
        run: |
          # Latest stable tag, anywhere (tags on main aren't ancestors of beta).
          BASE_TAG=$(git tag -l 'otterbot-v[0-9]*.[0-9]*.[0-9]' --sort=-version:refname | grep -E '^otterbot-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -n "$BASE_TAG" ]; then
            BASE_VERSION=${BASE_TAG#otterbot-v}
            MERGE_BASE=$(git merge-base "$BASE_TAG" HEAD 2>/dev/null || echo "")
            if [ -n "$MERGE_BASE" ]; then
              COMMIT_COUNT=$(git rev-list ${MERGE_BASE}..HEAD --count)
            else
              COMMIT_COUNT=$(git rev-list HEAD --count)
            fi
          else
            BASE_VERSION="0.0.0"
            COMMIT_COUNT=$(git rev-list HEAD --count)
          fi
          VERSION="${BASE_VERSION}-beta.${COMMIT_COUNT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed beta version: ${VERSION}"

      - name: Setup Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Assemble the npm package
        run: node scripts/build-package.mjs
        env:
          OTTERBOT_PKG_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish beta to npm
        run: npm publish ./dist-pkg --access public --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
