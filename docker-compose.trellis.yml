services:
  otterbot:
    environment:
      - OTTERBOT_TRELLIS_URL=${OTTERBOT_TRELLIS_URL:-http://trellis:8080}

  trellis:
    build:
      context: .
      dockerfile: docker/trellis/Dockerfile
    environment:
      - TRELLIS_DATA_ROOT=/data
      - TRELLIS_PORT=8080
      - TRELLIS_MODEL_REF=${TRELLIS_MODEL_REF:-microsoft/TRELLIS-image-large}
      - TRELLIS_INFERENCE_CMD=${TRELLIS_INFERENCE_CMD:-}
      - ENABLE_BLENDER_POSTPROCESS=${ENABLE_BLENDER_POSTPROCESS:-true}
    volumes:
      - ${OTTERBOT_DATA_DIR:-./docker/otterbot}/trellis:/data
    expose:
      - "8080"
    restart: unless-stopped
